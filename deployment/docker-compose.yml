services:
  translation-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8048:8048"
    environment:
      - TRANSLATE_API_PORT=8048
      - TRANSLATE_REDIS_URL=redis://redis:6379/0
      # vLLM servers (Gemma, Qwen) run on the host — reached via host-gateway
      - TRANSLATE_GEMMA_BASE_URL=http://host.docker.internal:30004/v1
      - TRANSLATE_GEMMA_MODEL_NAME=gemma-4-26b-a4b-it
      - TRANSLATE_QWEN_BASE_URL=http://host.docker.internal:8029/v1
      # IndicTrans2 is now a dedicated service on Chai_Tower (10.10.180.68)
      # — shared across all projects, no longer bundled here.
      - TRANSLATE_INDICTRANS_SERVICE_URL=http://10.10.180.68:8200
      - TRANSLATE_CORS_ALLOWED_ORIGINS=["*"]
      - TRANSLATE_CACHE_ENABLED=true
      # Timeouts (tweak these to reduce server-side timeouts/backpressure)
      - TRANSLATE_GOOGLETRANS_TIMEOUT_S=15
      - TRANSLATE_GEMMA_CLIENT_TIMEOUT_S=10
      - TRANSLATE_GEMMA_TIMEOUT_S=120
      - TRANSLATE_GEMMA_VERIFY_TIMEOUT_S=12
      - TRANSLATE_GEMMA_REPAIR_TIMEOUT_S=12
      - TRANSLATE_QWEN_TIMEOUT_S=20
      - TRANSLATE_INDICTRANS_TIMEOUT_S=90
      # Chunking/concurrency tunables (optional)
      - TRANSLATE_GEMMA_CHUNK_MAX_CHARS=600
      - TRANSLATE_GEMMA_MAX_CONCURRENT_REQUESTS=8
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "9045:9045"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

